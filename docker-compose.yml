version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "9000:9000"

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
      - BACKEND_URL=http://backend:9000
      - ML_SERVICE_URL=http://ml-service:8000/score
    depends_on:
      - redis
      - backend
      - ml-service

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
